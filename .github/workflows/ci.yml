name: CI

# PR and manual runs only, to keep within the free Actions budget (same as the DC repos).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PII scan
        env:
          # The scanner fails in CI if this is empty.
          PII_TERMS: ${{ secrets.PII_TERMS }}
        run: python3 scripts/check_pii.py --scan
      - name: Install  # client pin: keep in step with the Dockerfile
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/david2069/energipays-client.git@adb08c070426f0646dd724a1ffea7b6a5d3c9a03" && pip install -e ".[test]"
      - name: Import smoke (offline)
        run: python -c "import energipays_bridge.main; print(\"import OK\")"
      - name: Tests
        # No test suite yet; runs once tests/ exists. Never touches the live cloud.
        run: |
          if [ -d tests ]; then pip install pytest && pytest -q -m "not live"; else echo "no tests/ yet"; fi
